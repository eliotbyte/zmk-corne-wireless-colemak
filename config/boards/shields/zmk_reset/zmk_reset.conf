# Reset firmware configuration:
# - clears all BLE bonds on startup
# - resets persistent ZMK settings on startup
# - enables BLE

CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
CONFIG_ZMK_BLE=y

# This repo enables pointing in `config/prj.conf`; disable it for a lighter reset image.
CONFIG_ZMK_POINTING=n
CONFIG_ZMK_POINTING_SMOOTH_SCROLL=n
CONFIG_ZMK_POINTING_ACCEL=n

# Avoid persisting layers for a reset image.
CONFIG_ZMK_DEFAULT_LAYER_PERSISTENT=n

# Keep power management simple for the short-life reset firmware.
CONFIG_ZMK_SLEEP=n


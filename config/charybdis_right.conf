# ZMK_INPUT_SPLIT lives under "if ZMK_POINTING" in pointing/Kconfig — pointing must be on.
# If config/prj.conf is not merged in CI, this still enables split trackball for this shield.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# Deep sleep disabled: PMW3610 SPI doesn't reinitialize after deep sleep wakeup.
# Battery savings come from the sensor's own REST power-management modes instead.
CONFIG_ZMK_SLEEP=n

# PMW3610 internal power management — sensor progressively reduces poll rate:
# Run -> REST1 after 500ms, REST1 -> REST2 after 3s, REST2 -> REST3 after 30s.
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000
